<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">

            <!-- Title shown in the browser tab -->
            <title>SES — About</title>

            <!-- Connects this page to the external CSS file -->
            <link rel="stylesheet" href="style.css">
    </head>

    <body>

            <!--   FULL-SCREEN BACKGROUND IMAGE
                This image fills the entire page using the .fullpage class.
                It gives the About page a consistent look with the Home page.
             -->
        <img src="../assets/watermark1.png" class="fullpage">

            <!--    NAVIGATION MENU
                These buttons let the user move between the three pages.
                The nav-container positions the buttons in the top-left corner.
                Each link uses .nav-box for styling (rounded, colored buttons).
            -->
        <div class="nav-container">
             <a href="index.html" class="nav-box">Home</a>
             <a href="about.html" class="nav-box">About</a>
             <a href="team.html" class="nav-box">Team</a>
        </div>

            <!--    ABOUT TEXT BOX
                This semi-transparent box contains the page title and description.
                It is positioned lower on the page using .bottom-text.
                The blur and shadow effects help the text stand out from the background.
            -->
        <div class="bottom-text">
            <h1>About Sports Equity Systems</h1>

            <p>
            Sports Equity Systems (SES) is designed to create financial equity on the field in sports.
            SES creates a predictive payroll structure where each team pays the same percentage of
            their revenue on payroll.
            </p>
        </div>

    </body>
</html>
