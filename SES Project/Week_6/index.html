<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">

        <!-- Ensures the page scales correctly on phones and tablets -->
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <!-- Title shown in the browser tab -->
        <title>SES — Home</title>

        <!-- Connects this page to the external CSS file -->
        <link rel="stylesheet" href="style.css">
    </head>

    <body>

        <!--    FULL-PAGE BACKGROUND IMAGE
            This image fills the entire screen using the .fullpage class.
            It acts as the main visual background for the home page.
        -->
        <img src="../assets/watermark1.png" class="fullpage">

        <!--    NAVIGATION MENU
            These buttons let the user move between the three pages.
            The nav-container positions the buttons in the top-left corner.
            Each link uses .nav-box for styling (rounded, colored buttons).
        -->
        <div class="nav-container">
             <a href="index.html" class="nav-box">Home</a>
             <a href="about.html" class="nav-box">About</a>
             <a href="team.html" class="nav-box">Team</a>
        </div>

    </body>
</html>
