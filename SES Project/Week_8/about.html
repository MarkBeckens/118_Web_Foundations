<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">

            <!-- Title shown in the browser tab -->
            <title>SES — About</title>

            <!-- Connects this page to the external CSS file -->
            <link rel="stylesheet" href="style.css">
    </head>

    <body>

            <!--   FULL-SCREEN BACKGROUND IMAGE
                This image fills the entire page using the .fullpage class.
                It gives the About page a consistent look with the Home page.
             -->
        <img src="../assets/watermark1.png" class="fullpage">

            <!--    NAVIGATION MENU
                These buttons let the user move between the three pages.
                The nav-container positions the buttons in the top-left corner.
                Each link uses .nav-box for styling (rounded, colored buttons).
            -->
        <div class="nav-container">
             <a href="index.html" class="nav-box">Home</a>
             <a href="about.html" class="nav-box">About</a>
             <a href="team.html" class="nav-box">Team</a>
        </div>

            <!--    ABOUT TEXT BOX
                This semi-transparent box contains the page title and description.
                It is positioned lower on the page using .bottom-text.
                The blur and shadow effects help the text stand out from the background.
            -->
        <div class="bottom-text">
            <h1>About Sports Equity Systems</h1>

            <p>
            Sports Equity Systems (SES) is designed to create financial equity on the field in sports.
            SES creates a predictive payroll structure where each team pays the same percentage of
            their revenue on payroll.
            </p>

            <!--    REVENUE REPORT GENERATOR
                Clicking the button kicks off a timed, multi-step sequence (simulating a
                report being generated) before the user is sent to the Team page to view it.
                The chosen year and SES share % change the numbers shown on that page.
            -->
            <div class="report-box">
                <p class="report-question">Would you like to generate a revenue report?</p>

                <div class="report-controls">
                    <label for="reportYear">Year</label>
                    <select id="reportYear">
                        <option value="2023">2023</option>
                        <option value="2024">2024</option>

                        <option value="2026">2026 (predicted)</option>
                        <option value="2027">2027 (predicted)</option>
                        <option value="2028">2028 (predicted)</option>
                    </select>

                    <label for="reportPercent">SES Share</label>
                    <select id="reportPercent">

                        <option value="22">22%</option>

                        <option value="36">36%</option>
                        <option value="37">37%</option>
                        <option value="38">38%</option>
                        <option value="39">39%</option>
                        <option value="40">40%</option>
                        <option value="41">41%</option>
                        <option value="42">42%</option>
                        <option value="43">43%</option>

                        <option value="47">47%</option>
                        <option value="48">48%</option>
                        <option value="49">49%</option>
                        <option value="50" selected>50%</option>
                        <option value="51">51%</option>

                </div>

                <button id="createReportBtn" class="report-btn">Create Report</button>
